<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" stroke="#1a1a1a" stroke-width="1.5">
  <!-- Outer diamond -->
  <polygon points="100,20 180,100 100,180 20,100"/>
  <!-- Inner diamond -->
  <polygon points="100,45 155,100 100,155 45,100"/>
  <!-- Inner inner diamond -->
  <polygon points="100,65 135,100 100,135 65,100"/>
  <!-- Cross lines -->
  <line x1="100" y1="20" x2="100" y2="180"/>
  <line x1="20" y1="100" x2="180" y2="100"/>
  <!-- Diagonal details -->
  <line x1="60" y1="60" x2="140" y2="140" stroke-width="1" opacity="0.5"/>
  <line x1="140" y1="60" x2="60" y2="140" stroke-width="1" opacity="0.5"/>
  <!-- Center dot -->
  <circle cx="100" cy="100" r="4" fill="#1a1a1a"/>
  <!-- Corner dots -->
  <circle cx="100" cy="20" r="3" fill="#1a1a1a"/>
  <circle cx="180" cy="100" r="3" fill="#1a1a1a"/>
  <circle cx="100" cy="180" r="3" fill="#1a1a1a"/>
  <circle cx="20" cy="100" r="3" fill="#1a1a1a"/>
  <!-- Mid-edge dots -->
  <circle cx="140" cy="60" r="2" fill="#1a1a1a"/>
  <circle cx="140" cy="140" r="2" fill="#1a1a1a"/>
  <circle cx="60" cy="140" r="2" fill="#1a1a1a"/>
  <circle cx="60" cy="60" r="2" fill="#1a1a1a"/>
</svg>
