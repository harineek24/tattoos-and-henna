  <!-- Finger creases / knuckle lines -->
  <g stroke="#c09070" stroke-width="1" opacity="0.6">
    <!-- Pinky base crease -->
    <path d="M92 335 Q100 330 115 333"/>
    <!-- Ring finger base crease -->
    <path d="M135 290 Q155 282 175 288"/>
    <!-- Middle finger base crease -->
    <path d="M185 275 Q210 268 235 275"/>
    <!-- Index finger base crease -->
    <path d="M250 280 Q270 274 295 280"/>

