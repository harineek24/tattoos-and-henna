  </g>

  <!-- Subtle highlights for realism -->
  <g opacity="0.15" fill="white">
    <ellipse cx="200" cy="400" rx="40" ry="60"/>
    <ellipse cx="80" cy="170" rx="10" ry="25"/>
    <ellipse cx="160" cy="120" rx="12" ry="30"/>
    <ellipse cx="218" cy="100" rx="12" ry="35"/>
    <ellipse cx="278" cy="120" rx="12" ry="30"/>
