<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 750" fill="none">
  <defs>
    <!-- Skin gradient -->
    <radialGradient id="skin" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#f5d0b0"/>
      <stop offset="50%" stop-color="#e8b896"/>
      <stop offset="100%" stop-color="#d4a07a"/>
    </radialGradient>
    <radialGradient id="palm-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#daa88a"/>
      <stop offset="100%" stop-color="#c8967a"/>
    </radialGradient>
    <!-- Subtle shadow for depth -->
    <filter id="inner-shadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset dx="0" dy="2" result="offsetBlur"/>
      <feComposite in="SourceGraphic" in2="offsetBlur" operator="over"/>
    </filter>
  </defs>

