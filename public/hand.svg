      C 84,158 88,148 95,142
      C 102,136 110,137 116,144
      C 122,152 125,165 127,182
      C 129,200 130,222 130,248
      C 130,268 129,286 128,300

      C 133,308 140,312 148,308

      C 146,282 142,248 140,212
      C 138,176 137,144 138,118
      C 139,96 143,78 150,68
      C 157,58 165,56 173,62
      C 181,68 186,82 188,102
      C 190,126 190,155 190,188
      C 190,220 188,252 186,280

      C 192,290 200,294 208,290

      C 206,258 204,218 203,178
      C 202,138 202,102 204,74
      C 206,50 212,34 220,26
      C 228,18 236,20 242,30
      C 248,42 252,60 253,82
      C 254,108 254,142 254,178
      C 254,215 252,252 250,282

      C 256,292 264,296 272,292

      C 270,262 268,224 268,186
      C 268,148 270,116 274,92
      C 278,70 284,56 292,50
      C 300,44 308,48 312,60
      C 316,72 318,90 318,112
      C 318,140 316,172 314,205
      C 312,238 310,266 308,288

      C 310,312 312,332 316,348
      C 320,360 326,368 334,372

      C 344,375 356,368 366,354
      C 376,340 384,322 388,304
      C 390,290 388,278 382,272
      C 376,266 370,268 364,276
      C 356,288 348,306 340,326
      C 334,342 328,355 324,365

      C 320,375 316,390 312,410
      C 306,445 298,488 288,535
      C 278,580 268,625 260,665

      C 230,674 192,674 158,668
      Z
    " fill="url(#skin)" stroke="#c8a080" stroke-width="1.2" stroke-linejoin="round"/>
  </g>

  <!-- Palm depth shading -->
  <ellipse cx="200" cy="400" rx="80" ry="100" fill="url(#palm-depth)"/>

  <!-- Finger joint creases -->
  <g stroke="#c49878" stroke-width="0.8" opacity="0.45" fill="none" stroke-linecap="round">
    <!-- Pinky joints -->
    <path d="M 86,225 Q 100,220 122,225"/>
    <path d="M 84,185 Q 98,180 124,185"/>

    <!-- Ring joints -->
    <path d="M 140,200 Q 158,194 184,200"/>
    <path d="M 139,140 Q 158,134 186,140"/>

    <!-- Middle joints -->
    <path d="M 205,172 Q 222,166 248,172"/>
    <path d="M 204,110 Q 222,104 250,110"/>

    <!-- Index joints -->
    <path d="M 270,195 Q 286,189 312,195"/>
    <path d="M 272,130 Q 288,124 314,130"/>

    <!-- Thumb joint -->
    <path d="M 368,300 Q 378,292 386,300"/>
  </g>

  <!-- Palm lines -->
  <g stroke="#c49878" stroke-width="1" opacity="0.35" fill="none" stroke-linecap="round">
    <!-- Heart line -->
    <path d="M 100,355 Q 155,332 210,340 Q 260,346 310,335"/>
    <!-- Head line -->
    <path d="M 105,400 Q 160,382 220,388 Q 270,392 305,382"/>
    <!-- Life line -->
    <path d="M 300,330 Q 270,378 240,435 Q 215,492 190,548 Q 172,585 158,615"/>
    <!-- Fate line -->
    <path d="M 218,510 Q 220,455 222,410 Q 224,375 222,340"/>
  </g>

  <!-- Wrist creases -->
  <g stroke="#c49878" stroke-width="0.7" opacity="0.3" fill="none" stroke-linecap="round">
    <path d="M 162,645 Q 210,637 258,645"/>
    <path d="M 158,658 Q 210,650 260,658"/>
  </g>

  <!-- Fingernails (subtle) -->
  <g fill="#f0d4c0" stroke="#d4a890" stroke-width="0.6" opacity="0.7">
    <ellipse cx="105" cy="148" rx="9" ry="7"/>
    <ellipse cx="165" cy="68" rx="11" ry="8"/>
    <ellipse cx="230" cy="32" rx="12" ry="9"/>
    <ellipse cx="300" cy="56" rx="11" ry="8"/>
    <ellipse cx="384" cy="278" rx="8" ry="10" transform="rotate(-25 384 278)"/>
  </g>

  <!-- Subtle finger highlights -->
  <g opacity="0.08" fill="white">
    <ellipse cx="105" cy="200" rx="8" ry="30"/>
    <ellipse cx="165" cy="160" rx="9" ry="40"/>
    <ellipse cx="228" cy="140" rx="9" ry="45"/>
    <ellipse cx="290" cy="160" rx="9" ry="40"/>
    <ellipse cx="372" cy="310" rx="7" ry="20"/>
  </g>
