<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 700" fill="none">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#f5d2b5"/>
      <stop offset="50%" stop-color="#eabc98"/>
      <stop offset="100%" stop-color="#dba37c"/>
    </linearGradient>
    <radialGradient id="palm-depth" cx="48%" cy="42%" r="45%">
      <stop offset="0%" stop-color="#e0a880" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#e0a880" stop-opacity="0"/>
    </radialGradient>
    <filter id="hand-shadow" x="-8%" y="-5%" width="116%" height="112%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>

