<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 700" fill="none">
  <defs>
    <!-- Main skin fill -->
    <radialGradient id="skin" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#f5d2b5"/>
      <stop offset="60%" stop-color="#eabc98"/>
      <stop offset="100%" stop-color="#d9a67e"/>
    </radialGradient>
    <!-- Slightly darker for overlapping finger bases -->
    <radialGradient id="skin-shadow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#e8bc9a"/>
      <stop offset="100%" stop-color="#d4a07a"/>
    </radialGradient>
    <!-- Soft inner shadow -->
    <filter id="soft-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur"/>
      <feOffset dx="0" dy="4" result="offset"/>
      <feFlood flood-color="#000" flood-opacity="0.12" result="color"/>
      <feComposite in="color" in2="offset" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#soft-shadow)">
    <!-- ==================== -->
    <!--    PALM / WRIST       -->
    <!-- ==================== -->
    <path d="
      M 157,660
      C 150,640 138,600 125,555
      C 112,510 102,465 97,425
      C 92,385 90,355 92,330
      C 93,318 95,308 100,300
      L 100,300
      C 120,295 150,288 185,285
      C 215,283 245,283 270,286
      C 290,289 302,294 308,302
      C 313,310 315,325 315,345
      C 316,385 310,440 300,500
      C 290,555 278,605 268,660
      C 240,668 200,668 157,660
      Z
    " fill="url(#skin)" stroke="#cca080" stroke-width="1"/>

    <!-- ==================== -->
    <!--     PINKY FINGER      -->
    <!-- ==================== -->
    <path d="
      M 100,300
      C 98,285 95,265 92,240
      C 89,215 87,192 86,175
      C 85,155 87,142 92,135
      C 97,128 104,127 111,130
      C 118,133 122,142 124,158
      C 126,175 127,195 127,220
      C 127,245 126,270 125,295
      C 120,298 112,300 100,300
      Z
    " fill="url(#skin)" stroke="#cca080" stroke-width="1"/>

    <!-- ==================== -->
    <!--    RING FINGER        -->
    <!-- ==================== -->
    <path d="
      M 148,290
      C 146,268 143,238 141,208
      C 139,178 138,148 138,122
      C 138,98 141,80 148,70
      C 155,60 163,58 172,62
      C 181,66 186,78 188,96
      C 190,118 190,145 189,178
      C 188,210 186,242 184,270
      C 182,282 175,288 165,290
      C 158,291 152,291 148,290
      Z
    " fill="url(#skin)" stroke="#cca080" stroke-width="1"/>

    <!-- ==================== -->
    <!--    MIDDLE FINGER      -->
    <!-- ==================== -->
    <path d="
      M 198,285
      C 196,260 194,228 193,195
      C 192,162 191,128 192,98
      C 193,70 196,48 203,36
      C 210,24 219,22 228,28
      C 237,34 242,48 244,70
      C 246,95 247,128 246,165
      C 245,200 244,235 242,265
      C 240,278 235,285 228,287
      C 218,289 208,288 198,285
      Z
    " fill="url(#skin)" stroke="#cca080" stroke-width="1"/>

    <!-- ==================== -->
    <!--    INDEX FINGER       -->
    <!-- ==================== -->
    <path d="
      M 255,286
      C 254,262 253,232 254,200
      C 255,168 257,138 260,112
      C 263,88 268,70 276,60
      C 284,50 293,50 300,58
      C 307,66 311,82 312,104
      C 313,130 312,160 310,192
      C 308,224 306,254 304,280
      C 300,288 293,290 284,290
      C 272,290 262,289 255,286
      Z
    " fill="url(#skin)" stroke="#cca080" stroke-width="1"/>

    <!-- ==================== -->
    <!--       THUMB           -->
    <!-- ==================== -->
    <path d="
      M 308,302
      C 312,290 318,275 326,260
      C 336,242 348,226 358,218
      C 368,210 376,210 382,218
      C 388,226 388,240 384,258
      C 380,276 372,296 362,315
      C 352,334 342,348 332,358
      C 324,365 318,365 314,358
      C 310,348 308,332 308,302
      Z
    " fill="url(#skin)" stroke="#cca080" stroke-width="1"/>
  </g>

  <!-- ==================== -->
  <!--  FINGER JOINT LINES  -->
  <!-- ==================== -->
  <g stroke="#c09575" stroke-width="0.8" opacity="0.5" fill="none" stroke-linecap="round">
    <!-- Pinky joints -->
    <path d="M 90,230 Q 100,226 118,230"/>
    <path d="M 87,185 Q 98,181 120,185"/>

    <!-- Ring joints -->
    <path d="M 141,200 Q 155,195 182,200"/>
    <path d="M 140,140 Q 156,135 184,140"/>

    <!-- Middle joints -->
    <path d="M 195,190 Q 212,185 240,190"/>
    <path d="M 194,125 Q 213,120 242,125"/>

    <!-- Index joints -->
    <path d="M 257,195 Q 273,190 305,195"/>
    <path d="M 259,130 Q 276,125 308,130"/>

    <!-- Thumb joint -->
    <path d="M 348,265 Q 360,258 378,265"/>

    <!-- Knuckle line across palm top -->
    <path d="M 100,300 Q 140,285 200,282 Q 260,283 308,302"/>
  </g>

  <!-- ==================== -->
  <!--      PALM LINES       -->
  <!-- ==================== -->
  <g stroke="#c09575" stroke-width="1" opacity="0.4" fill="none" stroke-linecap="round">
    <!-- Heart line -->
    <path d="M 100,360 Q 150,338 200,345 Q 250,350 305,340"/>
    <!-- Head line -->
    <path d="M 105,405 Q 155,388 210,392 Q 260,396 300,385"/>
    <!-- Life line -->
    <path d="M 295,330 Q 265,378 235,435 Q 210,490 185,545 Q 170,580 158,610"/>
    <!-- Fate line -->
    <path d="M 215,520 Q 218,465 220,420 Q 222,380 220,340"/>
  </g>

  <!-- ==================== -->
  <!--     WRIST CREASES     -->
  <!-- ==================== -->
  <g stroke="#c09575" stroke-width="0.8" opacity="0.35" fill="none" stroke-linecap="round">
    <path d="M 160,642 Q 210,634 260,642"/>
    <path d="M 155,654 Q 210,646 265,654"/>
  </g>

  <!-- ==================== -->
  <!--     FINGERNAILS       -->
  <!-- ==================== -->
  <g fill="#f2daca" stroke="#d4aa90" stroke-width="0.7" opacity="0.8">
    <!-- Pinky nail -->
    <ellipse cx="101" cy="138" rx="10" ry="8"/>
    <!-- Ring nail -->
    <ellipse cx="163" cy="70" rx="12" ry="9"/>
    <!-- Middle nail -->
    <ellipse cx="217" cy="34" rx="13" ry="10"/>
    <!-- Index nail -->
    <ellipse cx="287" cy="62" rx="12" ry="9"/>
    <!-- Thumb nail -->
    <ellipse cx="380" cy="222" rx="9" ry="11" transform="rotate(-30 380 222)"/>
  </g>

  <!-- ==================== -->
  <!--   SUBTLE HIGHLIGHTS   -->
  <!-- ==================== -->
  <g opacity="0.1" fill="white">
    <ellipse cx="200" cy="400" rx="45" ry="65"/>
    <ellipse cx="100" cy="210" rx="8" ry="25"/>
    <ellipse cx="163" cy="155" rx="10" ry="30"/>
    <ellipse cx="217" cy="135" rx="10" ry="35"/>
    <ellipse cx="280" cy="155" rx="10" ry="30"/>
    <ellipse cx="365" cy="260" rx="8" ry="20"/>
  </g>
</svg>
